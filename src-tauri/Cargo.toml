[package]
name = "handy"
version = "0.8.3"
description = "Handy"
authors = ["cjpais"]
edition = "2021"
license = "MIT"
default-run = "handy"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "handy_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# [[bin]]
# name = "cli"
# path = "src/audio_toolkit/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }

[dependencies]
once_cell = "1.21.4"
tauri = { version = "2.12.5", features = [
  "protocol-asset",
  "macos-private-api",
  "tray-icon",
  'image-png',
] }
tauri-plugin-log = "2.10.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-store = "2.5.0"
tauri-plugin-os = "2.4.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-process = "2.4.0"
rusqlite_migration = "2.6.0"
tauri-plugin-fs = "2.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rdev = { git = "https://github.com/rustdesk-org/rdev" }
cpal = "0.16.0"
anyhow = "1.0.104"
rubato = "0.16.2"
hound = "3.5.1"
log = "0.4.34"
env_filter = "2.0.0"
tokio = "1.54.1"
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false }
enigo = "0.6.1"
rodio = { git = "https://github.com/cjpais/rodio.git" }
reqwest = { version = "0.13.5", features = ["blocking", "json", "multipart", "stream"] }
futures-util = "0.3.34"
rustfft = "6.4.1"
strsim = "0.11.1"
natural = "0.5.0"
regex = "1.13.1"
chrono = "0.4.45"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tar = "0.4.46"
flate2 = "1.1.10"
sha2 = "0.11.1"
transcribe-rs = { version = "0.3.12", features = ["whisper-cpp", "onnx"] }
# 0.3 requires privileged evdev/uinput access on Linux; retain the current backend.
handy-keys = "0.2.4"
ferrous-opencc = "0.4.0"
clap = { version = "4.6.7", features = ["derive"] }
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2.8.3"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.14.0"

[target.'cfg(windows)'.dependencies]
transcribe-rs = { version = "0.3.12", features = ["whisper-vulkan", "ort-directml"] }
windows = { version = "0.61.3", features = [
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
transcribe-rs = { version = "0.3.12", features = ["whisper-metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk-layer-shell = { version = "0.8.2", features = ["v0_6"] }
gtk = "0.18"
transcribe-rs = { version = "0.3.12", features = ["whisper-vulkan"] }

# Upstream Tauri now includes the macOS work-area coordinate correction that
# previously required the handy-2.10.2 runtime fork.

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
